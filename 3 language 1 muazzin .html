<script>

(function(){
  const MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const PRAYERS={
    'Isha':['isha','इशा','ईशा'],
    'Sun Set':['sun set','sunset','sun-set','सनसेट','सन सेट','सूरज डूबना','सूर्यास्त','sunset time'],
    'Zaval':['zaval','zawal','zawaal','ज़वाल','जवाल','जव्वाल'],
    'Asr Shafee':['asr shafee','asr shafai','asr shafi','असर शाफई','असर शफई','असर शाफ़ई'],
    'Asr':['asr','असर','अस्र'],
    'Subeh Sadiq':['subeh sadiq','subah sadiq','subhe sadiq','subah sadik','सुबह सादिक','सुबह सादिक़','फज्र','फ़ज्र','fajr'],
    'Sun Rise':['sun rise','sunrise','sun-rise','सूर्योदय','सूरज निकलना']
  };
  const WORDS={
    'एक':1,'दो':2,'तीन':3,'चार':4,'पांच':5,'पाँच':5,'छह':6,'छः':6,'सात':7,'आठ':8,'नौ':9,'दस':10,'ग्यारह':11,'बारह':12,'तेरह':13,'चौदह':14,'पंद्रह':15,'पन्द्रह':15,'सोलह':16,'सत्रह':17,'अठारह':18,'उन्नीस':19,'बीस':20,'इक्कीस':21,'बाईस':22,'तेईस':23,'चौबीस':24,'पच्चीस':25,'छब्बीस':26,'सत्ताईस':27,'अट्ठाईस':28,'अट्ठाइस':28,'उनतीस':29,'तीस':30,'इकतीस':31,
    'اک':1,'دو':2,'تین':3,'چار':4,'پانچ':5,'چھ':6,'سات':7,'آٹھ':8,'نو':9,'دس':10,'گیارہ':11,'بارہ':12,'تیرہ':13,'چودہ':14,'پندرہ':15,'سولہ':16,'سترہ':17,'اٹھارہ':18,'انیس':19,'بیس':20,'اکیس':21,'بائیس':22,'تئیس':23,'چوبیس':24,'پچیس':25,'چھبیس':26,'ستائیس':27,'اٹھائیس':28,'انتیس':29,'تیس':30,'اکتیس':31
  };
  function clean(v){return String(v||'').toLowerCase().replace(/[\u00a0]+/g,' ').replace(/[‐‑‒–—-]/g,' ').replace(/\s+/g,' ').trim();}
  function dateNumber(v){
    const t=clean(v); if(WORDS[t]) return WORDS[t];
    const d=t.replace(/[०-९]/g,ch=>'०१२३४५६७८९'.indexOf(ch));
    const m=d.match(/\b\d{1,2}\b/); if(!m)return null;
    const n=parseInt(m[0],10); return n>=1&&n<=31?n:null;
  }
  function prayerFromText(v){
    const t=clean(v);
    const all=[];
    Object.keys(PRAYERS).forEach(name=>PRAYERS[name].forEach(a=>all.push({name,a:clean(a)})));
    all.sort((x,y)=>y.a.length-x.a.length);
    for(const x of all){ if(t===x.a || t.includes(x.a)) return x.name; }
    return null;
  }
  function currentMonth(){
    const wanted=MONTHS[new Date().getMonth()];
    let found=null;
    document.querySelectorAll('.month').forEach(sec=>{
      const title=(sec.getAttribute('data-month')||sec.querySelector('h2')?.textContent||'').trim().toUpperCase();
      if(title===wanted)found=sec;
    });
    return found;
  }
  function prayerColumn(table,name){
    const wanted=PRAYERS[name]||[name];
    const normalized=wanted.map(clean);
    const heads=Array.from(table.querySelectorAll('thead th'));
    return heads.findIndex(h=>normalized.includes(clean(h.textContent)));
  }
  function clearRowsOnly(){
    document.querySelectorAll('.month').forEach(sec=>{
      sec.classList.remove('hiddenMonth','hasNoMatch');
      sec.querySelectorAll('tbody tr').forEach(r=>{r.style.display='';r.classList.remove('search-hit');});
      sec.querySelectorAll('th,td').forEach(c=>c.classList.remove('focus-col'));
    });
  }
  function goToDatePrayer(day,name){
    const sec=currentMonth();
    if(!sec)return;
    document.querySelectorAll('.month').forEach(m=>m.classList.add('hiddenMonth'));
    sec.classList.remove('hiddenMonth');
    const table=sec.querySelector('table');
    if(!table)return;
    const idx=prayerColumn(table,name);
    let target=null;
    table.querySelectorAll('tbody tr').forEach(row=>{
      const cells=row.querySelectorAll('td');
      const n=parseInt((cells[0]?.textContent||'').replace(/[^0-9]/g,''),10);
      const hit=n===day;
      row.style.display=hit?'':'none';
      row.classList.toggle('search-hit',hit);
      if(hit)target=row;
    });
    table.querySelectorAll('thead th').forEach((h,i)=>h.classList.toggle('focus-col',i===0||i===idx));
    table.querySelectorAll('tbody tr').forEach(row=>row.querySelectorAll('td').forEach((td,i)=>td.classList.toggle('focus-col',i===0||i===idx)));
    const box=document.getElementById('timingResults');
    if(box){
      let time='—';
      if(target&&idx>=0)time=(target.querySelectorAll('td')[idx]?.textContent||'—').trim();
      box.innerHTML='<div class="timing-title">🕌 '+day+' '+name+' — '+time+'</div>';
      box.classList.add('show');
    }
    const banner=document.getElementById('focusBanner');
    if(banner)banner.textContent='🔎 '+day+' '+name+' — Aaj ke chal rahe mahine mein';
    if(target)target.scrollIntoView({behavior:'smooth',block:'center'}); else sec.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function goToTodayPrayer(name){
    const day=new Date().getDate();
    goToDatePrayer(day,name);
    const banner=document.getElementById('focusBanner');
    if(banner)banner.textContent='🔎 Aaj ki tareekh — '+name;
  }
  window.quickPrayerSearch=function(name){goToTodayPrayer(name);};
  window.datePrayerSearch=function(day,name){goToDatePrayer(day,name);};
  window.clearSearch=function(){
    const input=document.getElementById('searchBox'); if(input)input.value='';
    document.body.classList.remove('focus-column-mode'); clearRowsOnly();
    const banner=document.getElementById('focusBanner'); if(banner)banner.textContent='';
    const box=document.getElementById('timingResults'); if(box){box.classList.remove('show');box.innerHTML='';}
  };
  window.filterTable=function(){
    const input=document.getElementById('searchBox');
    const raw=(input?.value||'').trim();
    if(!raw){window.clearSearch();return;}
    const q=clean(raw);
    // Find the first date number (1-31) anywhere in the search text.
    const tokens=q.split(' ');
    let day=null, dayTokenIndex=-1;
    for(let i=0;i<tokens.length;i++){const n=dateNumber(tokens[i]);if(n){day=n;dayTokenIndex=i;break;}}
    const prayer=prayerFromText(q);
    if(day&&prayer){goToDatePrayer(day,prayer);return;}
    if(prayer){goToTodayPrayer(prayer);return;}

    // Ordinary text search remains available.
    document.body.classList.remove('focus-column-mode');
    let firstMatch=null;
    document.querySelectorAll('.month').forEach(sec=>{
      const monthName=clean(sec.getAttribute('data-month')||sec.querySelector('h2')?.textContent||'');
      let rowHit=false;
      sec.querySelectorAll('tbody tr').forEach(row=>{
        const ok=clean(row.textContent).includes(q)||monthName.includes(q);
        row.style.display=ok?'':'none'; row.classList.toggle('search-hit',ok);
        if(ok){rowHit=true;if(!firstMatch)firstMatch=row;}
      });
      sec.classList.toggle('hiddenMonth',!rowHit);
    });
    const banner=document.getElementById('focusBanner');if(banner)banner.textContent='🔎 Search: '+raw;
    if(firstMatch)firstMatch.scrollIntoView({behavior:'smooth',block:'center'});
  };
  window.jumpMonth=window.jumpMonth||function(v){if(!v)return;window.clearSearch();const el=document.querySelector('.month[data-month="'+v+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});};
})();
</script>
